<!DOCTYPE hmtl>
<html lang="en">

<head>
    <title>COL tag</title>
</head>
<body>
    <table>
        <colgroup>
            <col span="2" style="background-color:rgb(53, 136, 204)">
            <col style="background-color:rgb(183, 158, 207)">
        </colgroup>
        <tr>
            <th>ISBN</th>
            <th>Title</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>3476896</td>
            <td>My first HTML</td>
            <td>$53</td>
        </tr>
    </table>
</body>
</html>
